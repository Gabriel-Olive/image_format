<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Format Converter Pro</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>Image Format Converter Pro</h1>
            <p>Convert your images to high-quality lossless PNG and manage metadata</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-target="hide-tab">Convert Images</button>
            <button class="tab-btn" data-target="extract-tab">Restore Original</button>
        </div>

        <main>
            <!-- HIDE TAB -->
            <section id="hide-tab" class="tab-content active">
                <div class="form-group">
                    <label>1. Select Images to Convert (PNG/JPG)</label>
                    <div class="file-drop-area" id="hide-image-area">
                        <span class="file-msg" id="hide-image-msg">Drag & Drop or Click to Select</span>
                        <input type="file" id="hide-image-input" accept="image/png, image/jpeg, image/jpg" multiple>
                    </div>
                </div>

                <div class="capacity-info" id="capacity-info">
                    Conversion Buffer: -- KB
                </div>

                <div class="form-group">
                    <label>2. Processing Level</label>
                    <select id="bit-config">
                        <option value="1">Level 1 (Standard Processing)</option>
                        <option value="2">Level 2 (Deep Processing)</option>
                        <option value="4">Level 3 (Maximum Processing)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>3. Add Metadata/Watermark File (Optional)</label>
                    <div class="file-drop-area" id="hide-file-area">
                        <span class="file-msg" id="hide-file-msg">Drag & Drop or Click to Select</span>
                        <input type="file" id="hide-file-input">
                    </div>
                </div>

                <button class="action-btn" id="hide-btn" disabled>Convert & Download</button>
            </section>

            <!-- EXTRACT TAB -->
            <section id="extract-tab" class="tab-content">
                <div class="form-group">
                    <label>1. Select Converted Images to Restore (PNG)</label>
                    <div class="file-drop-area" id="extract-image-area">
                        <span class="file-msg" id="extract-image-msg">Drag & Drop or Click to Select</span>
                        <input type="file" id="extract-image-input" accept="image/png" multiple>
                    </div>
                </div>

                <button class="action-btn" id="extract-btn" disabled>Restore Original File</button>
            </section>
        </main>

        <div id="toast" class="toast"></div>
    </div>

    <!-- Hidden canvas for image processing -->
    <canvas id="canvas" style="display: none;"></canvas>

    <script src="index.js"></script>
</body>
</html>
