<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Format Converter Pro</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>Image Format Converter Pro</h1>
            <p>Converta suas imagens para PNG lossless de alta qualidade e gerencie metadados</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-target="hide-tab">Converter Imagens</button>
            <button class="tab-btn" data-target="extract-tab">Restaurar Original</button>
        </div>

        <main>
            <!-- HIDE TAB -->
            <section id="hide-tab" class="tab-content active">
                <div class="form-group">
                    <label>1. Selecione as Imagens para Converter (PNG/JPG)</label>
                    <div class="file-drop-area" id="hide-image-area">
                        <span class="file-msg" id="hide-image-msg">Arraste, clique ou cole (Ctrl+V) para selecionar</span>
                        <input type="file" id="hide-image-input" accept="image/png, image/jpeg, image/jpg" multiple>
                    </div>
                </div>

                <div class="capacity-info" id="capacity-info">
                    Buffer de Conversão: -- KB
                </div>

                <div class="form-group">
                    <label>2. Nível de Processamento</label>
                    <select id="bit-config">
                        <option value="1">Nível 1 (Processamento Padrão)</option>
                        <option value="2">Nível 2 (Processamento Profundo)</option>
                        <option value="4">Nível 3 (Processamento Máximo)</option>
                        <option value="3">Nível Blindado (Correção de Erros 3x - Ultrassaturo)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>3. Adicionar Arquivo de Metadados/Marca d'água (Opcional)</label>
                    <div class="file-drop-area" id="hide-file-area">
                        <span class="file-msg" id="hide-file-msg">Arraste e solte ou clique para selecionar</span>
                        <input type="file" id="hide-file-input">
                    </div>
                </div>

                <button class="action-btn" id="hide-btn" disabled>Converter & Baixar</button>
            </section>

            <!-- EXTRACT TAB -->
            <section id="extract-tab" class="tab-content">
                <div class="form-group">
                    <label>1. Selecione as Imagens Convertidas para Restaurar (PNG)</label>
                    <div class="file-drop-area" id="extract-image-area">
                        <span class="file-msg" id="extract-image-msg">Arraste e solte ou clique para selecionar</span>
                        <input type="file" id="extract-image-input" accept="image/png" multiple>
                    </div>
                </div>

                <button class="action-btn" id="extract-btn" disabled>Restaurar Arquivo Original</button>
            </section>
        </main>
        
        <footer>
            <span class="version-tag">Engine v3.0.0-PRO</span>
        </footer>

        <div id="toast" class="toast"></div>
    </div>

    <!-- Hidden canvas for image processing -->
    <canvas id="canvas" style="display: none;"></canvas>

    <script src="index.js"></script>
</body>
</html>
